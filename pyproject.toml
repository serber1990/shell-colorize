[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shellcolorize"
dynamic = ["version"]
description = "Add color and style to terminal output using ANSI codes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Serber1990", email = "serber1990@pm.me" }]
requires-python = ">=3.9"
keywords = ["ansi", "color", "terminal", "cli", "no-color"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Terminals",
    "Typing :: Typed",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage       = "https://github.com/serber1990/shell-colorize"
"Bug Tracker"  = "https://github.com/serber1990/shell-colorize/issues"
"Source Code"  = "https://github.com/serber1990/shell-colorize"
Changelog      = "https://github.com/serber1990/shell-colorize/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["shellcolorize"]

[tool.setuptools.dynamic]
version = { attr = "shellcolorize.__version__" }

[tool.setuptools.package-data]
shellcolorize = ["py.typed"]

[tool.ruff]
target-version = "py39"

[tool.ruff.lint]
select = ["E9", "F", "B"]
